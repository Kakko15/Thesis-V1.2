# ============================================================================
# SonarQube configuration — ISO/IEC 25010 Reliability instrument
# (thesis paper, Table 4 and Section 3.2.4: continuous static code analysis
# to detect logic flaws, unhandled exceptions, and reliability fault points).
#
# Local SonarQube Community Build (current supported release):
#   1. Start the latest Community Build with its supported JDK 25 LTS runtime.
#   2. Create a project + token in the SonarQube UI.
#   3. Generate backend coverage first:
#        cd rag-thesis-backend
#        pytest --cov=routers --cov=services --cov=dependencies --cov=main --cov=config --cov=models --cov-report=xml
#   4. Generate frontend coverage:
#        cd rag-thesis-frontend
#        npm run test:coverage
#   5. From the repository root:
#        sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<your-token>
#
# SonarCloud alternative: uncomment sonar.organization below, add the
# SONAR_TOKEN repository secret, and the CI workflow
# (.github/workflows/quality.yml) scans on every push to main.
# ============================================================================

sonar.projectKey=isu-thesis-ai-library
sonar.projectName=ISU Centralized AI-Powered Thesis Library
sonar.projectVersion=2.0.0
# sonar.organization=<your-sonarcloud-organization>

# Sources: FastAPI backend + React frontend
sonar.sources=rag-thesis-backend,rag-thesis-frontend/src
sonar.tests=rag-thesis-backend/tests
# NOTE: do not add `sonar.test.inclusions` here to pick up the colocated
# frontend tests. It filters the whole test file set, not just the frontend's,
# so `**/*.test.js` silently dropped every Python file under sonar.tests from
# the analysis - measured 2026-09-02, Python files analysed fell from 102 to 59.
# The frontend tests are kept out of *source* analysis by an exclusion below
# instead, which leaves backend test indexing untouched.

# Keep generated/vendored artifacts out of the analysis
sonar.exclusions=\
  rag-thesis-backend/.venv*/**,\
  rag-thesis-backend/tests/**,\
  rag-thesis-backend/evaluation/results/**,\
  **/__pycache__/**,\
  rag-thesis-frontend/node_modules/**,\
  rag-thesis-frontend/dist/**,\
  rag-thesis-backend/tmp-*/**,\
  rag-thesis-backend/.pytest-*/**,\
  rag-thesis-backend/.pytest_cache/**,\
  rag-thesis-backend/.pylint-*/**,\
  rag-thesis-frontend/src/**/*.test.js

# The glob is .venv* on purpose. It read .venv/** while the environment the
# documented commands actually used was .venv3146, so every vendored library
# under it sat inside sonar.sources and would have been analysed as project
# code. The environment was renamed back to .venv on 2026-09-02 and the glob is
# deliberately left wildcarded, so neither name -- nor a future one -- can
# reintroduce the defect.
# Local scratch directories. They are gitignored, so a clean CI checkout never
# sees them, but a developer running this scan locally would otherwise analyse
# them as project code. rag-thesis-backend/tmp-review-py312 alone holds a full
# 411-file copy of the source tree, which would have inflated the duplication
# metric that Table 4 reports.
# Frontend unit tests sit beside the code they cover, so they cannot go in
# sonar.tests (which must be disjoint from sonar.sources). Excluding them from
# source analysis stops rules meant for shipped software being applied to
# assertions - two of the three bugs in the first 2026-09-02 scan came from one
# .test.js file that way. Their coverage still counts: it arrives through
# sonar.javascript.lcov.reportPaths, which is unaffected by source exclusions.
sonar.python.version=3.14
sonar.python.coverage.reportPaths=rag-thesis-backend/coverage.xml
# Frontend coverage (R7). Without this the React sources reported 0%, which is
# what pulled the whole-repository figure down to 36.3% even though the backend
# was above 90%. Generate with `npm run test:coverage` in rag-thesis-frontend.
sonar.javascript.lcov.reportPaths=rag-thesis-frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
