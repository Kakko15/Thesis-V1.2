name: Deploy backend to VM

on:
  workflow_run:
    workflows: ["Quality — ISO/IEC 25010"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pull and rebuild on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/Thesis-V1
            git pull --ff-only
            API_DOMAIN=${{ secrets.API_DOMAIN }} docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
            sleep 20
            curl -fsS https://${{ secrets.API_DOMAIN }}/health
