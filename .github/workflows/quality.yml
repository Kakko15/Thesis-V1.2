# ISO/IEC 25010 internal quality gate (thesis paper, Objective 4 / Table 4):
#   * PyTest  — Functional Suitability
#   * Pylint  — Maintainability (backend)
#   * ESLint  — Maintainability (frontend)
#   * SonarQube — Reliability (runs only when the SONAR_TOKEN secret is set)

name: Quality — ISO/IEC 25010

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend · PyTest + Pylint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-thesis-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: rag-thesis-backend/requirements.lock

      # --require-hashes verifies every distribution's SHA-256 and rejects
      # anything not pinned in the lock, so CI installs the same bytes the
      # container does.
      - name: Install dependencies (hash-verified)
        run: pip install --require-hashes -r requirements.lock

      - name: Verify Python dependency consistency
        run: pip check

      # Audits the lock rather than requirements.txt, so transitive advisories
      # are covered too. --no-deps is correct here precisely because the lock is
      # already the complete, fully pinned set.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit --no-deps -r requirements.lock

      - name: PyTest with coverage (Functional Suitability)
        run: >
          pytest --cov=routers --cov=services --cov=dependencies --cov=workers
          --cov=main --cov=config --cov=models
          --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Pylint (Maintainability)
        run: pylint --rcfile=.pylintrc routers services dependencies workers main.py config.py models.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: rag-thesis-backend/coverage.xml

  frontend:
    name: Frontend · ESLint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-thesis-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: rag-thesis-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint (Maintainability)
        run: npm run lint

      - name: Frontend unit tests with coverage (Functional Suitability)
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: rag-thesis-frontend/coverage/lcov.info

      - name: Production build
        run: npm run build

      # Guards the eager payload every visitor downloads, and that the WebGL and
      # charting chunks stay behind their lazy imports.
      - name: Bundle-size budget
        run: npm run bundle:budget

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright critical flows
        run: npm run test:e2e

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3

  containers:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: rag-thesis-backend
          - name: frontend
            context: rag-thesis-frontend
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.name }} image
        run: docker build -t isu-thesis-${{ matrix.name }}:ci ${{ matrix.context }}
      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: isu-thesis-${{ matrix.name }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # Records what the image actually contains, per commit, rather than
      # inferring it from requirements.txt. This is the artifact that answers
      # "was this build affected?" when the next advisory lands — the
      # cryptography CVE on 2026-08-04 had to be diagnosed without one.
      # sbom-action uploads the result as a workflow artifact itself, so there is
      # no separate upload step to keep in sync.
      - name: Generate ${{ matrix.name }} SBOM
        uses: anchore/sbom-action@v0
        with:
          image: isu-thesis-${{ matrix.name }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

  sonarqube:
    name: SonarQube (Reliability)
    runs-on: ubuntu-latest
    # Both coverage reports are inputs to the scan. Without the frontend one the
    # React sources analyse as 0% covered, which is what held the
    # whole-repository figure at 36.3%.
    needs: [backend, frontend]
    steps:
      - name: Checkout (full history for accurate blame data)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for SonarQube token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN secret not set — skipping the scan (see README, SonarQube section)."
          fi

      - name: Download backend coverage
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: rag-thesis-backend

      - name: Download frontend coverage
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: rag-thesis-frontend/coverage

      - name: SonarQube scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
