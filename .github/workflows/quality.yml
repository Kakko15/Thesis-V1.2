# ISO/IEC 25010 internal quality gate (thesis paper, Objective 4 / Table 4):
#   * PyTest  — Functional Suitability
#   * Pylint  — Maintainability (backend)
#   * ESLint  — Maintainability (frontend)
#   * SonarQube — Reliability (runs only when the SONAR_TOKEN secret is set)

name: Quality — ISO/IEC 25010

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN. Without this block every job inherits the
# repository default, which on repositories created before February 2023 is
# read/write on all scopes — contents and packages included — for jobs that
# only ever read the tree and build images. Anything a job genuinely needs is
# granted back on that job; today only the secret scan needs more.
permissions:
  contents: read

# Superseded pull-request runs are cancelled; every push to main keeps its own
# run, because those are the dated evidence artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend · PyTest + Pylint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-thesis-backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Kept in step with the interpreter assertion in
          # rag-thesis-backend/Dockerfile. Moved 3.14.6 -> 3.14.7 on 2026-08-25
          # when the Chainguard base was re-pinned to clear CVE-2026-14456.
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: rag-thesis-backend/requirements.lock

      # --require-hashes verifies every distribution's SHA-256 and rejects
      # anything not pinned in the lock, so CI installs the same bytes the
      # container does.
      - name: Install dependencies (hash-verified)
        run: pip install --require-hashes -r requirements.lock

      - name: Verify Python dependency consistency
        run: pip check

      # Audits the lock rather than requirements.txt, so transitive advisories
      # are covered too. --no-deps is correct here precisely because the lock is
      # already the complete, fully pinned set.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit --no-deps -r requirements.lock

      - name: PyTest with coverage (Functional Suitability)
        run: >
          pytest --cov=routers --cov=services --cov=dependencies --cov=workers
          --cov=main --cov=config --cov=models
          --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Pylint (Maintainability)
        run: pylint --rcfile=.pylintrc routers services dependencies workers main.py config.py models.py

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: rag-thesis-backend/coverage.xml

  frontend-audit:
    name: Frontend · dependency audit
    runs-on: ubuntu-latest
    # Three attempts that each wait up to five minutes, plus backoff.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rag-thesis-frontend
    # `npm audit` resolves the tree from package-lock.json, so this needs no
    # install and is verified to report the same counts with no node_modules
    # present. Kept out of the build job because npm's advisory endpoint is a
    # third party: when it was unreachable on 2026-09-04 it took ESLint, the
    # unit tests, the build, the bundle budget and Playwright down with it, and
    # a failed job also discards the caches it would have saved. Split out, an
    # outage fails this job alone and is still red - a gate that cannot run is
    # never reported as a gate that passed.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'

      # `npm audit` exits 1 both for real findings and for registry failures, so
      # a timeout on npm's bulk advisory endpoint failed this job on 2026-09-04
      # with no vulnerability to fix ("audit endpoint returned an error").
      #
      # That endpoint was not down, it was slow: measured the same day, a
      # one-package POST answered 200 after 131 s, and the real 341-package
      # payload after 294 s. A short client timeout turns that into a hard
      # failure, so the timeout is five minutes and npm's own retry is off -
      # retrying a slow request only multiplies the wait. The loop then retries
      # genuine endpoint errors twice more. A high or critical advisory still
      # fails the job on the first attempt, and an endpoint that never answers
      # fails it too rather than passing an unverified tree.
      - name: Audit production dependencies
        run: |
          backoff="15 30 0"
          for attempt in 1 2 3; do
            if report=$(npm audit --omit=dev --audit-level=high --fetch-timeout=300000 --fetch-retries=0 2>&1); then
              echo "$report"
              exit 0
            fi
            echo "$report"
            if ! grep -qE 'audit endpoint returned an error|network timeout|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND' <<<"$report"; then
              echo "::error::High or critical advisories in production dependencies."
              exit 1
            fi
            echo "npm's advisory endpoint did not answer (attempt $attempt/3)."
            wait_for=$(cut -d' ' -f"$attempt" <<<"$backoff")
            if [ "$wait_for" -gt 0 ]; then sleep "$wait_for"; fi
          done
          echo "::error::npm audit could not reach the advisory endpoint after 3 attempts."
          exit 1

  frontend:
    name: Frontend · ESLint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-thesis-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: rag-thesis-frontend/package-lock.json

      # `npm ci` rebuilt the whole tree on every run: 303 s of a 622 s job on
      # 2026-09-04, the single largest cost in CI. The resolved tree is a pure
      # function of the lockfile, the Node version and the runner image, so it
      # is cached whole and the install only runs on a miss. `--no-audit` here
      # suppresses npm's install-time advisory call only; the audit gate below
      # is a separate invocation and is unaffected.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: rag-thesis-frontend/node_modules
          key: node-modules-${{ runner.os }}-node24.18.0-${{ hashFiles('rag-thesis-frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: ESLint (Maintainability)
        run: npm run lint

      - name: Frontend unit tests with coverage (Functional Suitability)
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: rag-thesis-frontend/coverage/lcov.info

      - name: Production build
        run: npm run build

      # Guards the eager payload every visitor downloads, and that the WebGL and
      # charting chunks stay behind their lazy imports.
      - name: Bundle-size budget
        run: npm run bundle:budget

      # Keyed on the lockfile, so a @playwright/test bump invalidates it.
      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('rag-thesis-frontend/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright critical flows
        run: npm run test:e2e

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # The only job that needs more than the workflow default. gitleaks-action
    # reads the pull request's commits through the API, which `contents: read`
    # alone does not cover; the step below already records why the token is
    # required and that read-only is enough.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Dependabot-driven pull_request runs failed here on every branch while
      # pushes to main passed: the action reads the PR's commits through the API
      # and needs the workflow token to do so. Pull requests receive a read-only
      # token, which is sufficient.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: rag-thesis-backend
          - name: frontend
            context: rag-thesis-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build ${{ matrix.name }} image
        run: docker build -t isu-thesis-${{ matrix.name }}:ci ${{ matrix.context }}

      # Trivy and the SBOM inspect the image; neither starts it. The image built
      # from da9e931 passed both and failed on `docker run` with
      # ModuleNotFoundError, because the Dockerfile copies named modules and had
      # not learned about warning_filters.py. Importing both entrypoints with
      # placeholder credentials is the cheapest proof the image can start; the
      # settings validator accepts them and nothing is contacted at import.
      - name: Smoke-test the ${{ matrix.name }} image (entrypoints import)
        if: matrix.name == 'backend'
        run: >
          docker run --rm
          -e GEMINI_API_KEY=test-key
          -e SUPABASE_URL=https://test-project.supabase.co
          -e SUPABASE_KEY=test-key
          -e APP_ENVIRONMENT=test
          isu-thesis-backend:ci
          python -c "import main, workers.ingestion_worker; print('backend image imports', main.app.version)"
      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: isu-thesis-${{ matrix.name }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # Records what the image actually contains, per commit, rather than
      # inferring it from requirements.txt. This is the artifact that answers
      # "was this build affected?" when the next advisory lands — the
      # cryptography CVE on 2026-08-04 had to be diagnosed without one.
      # sbom-action uploads the result as a workflow artifact itself, so there is
      # no separate upload step to keep in sync.
      - name: Generate ${{ matrix.name }} SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: isu-thesis-${{ matrix.name }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

  sonarqube:
    name: SonarQube (Reliability)
    runs-on: ubuntu-latest
    # Both coverage reports are inputs to the scan. Without the frontend one the
    # React sources analyse as 0% covered, which is what held the
    # whole-repository figure at 36.3%.
    needs: [backend, frontend]
    steps:
      - name: Checkout (full history for accurate blame data)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check for SonarQube token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN secret not set — skipping the scan (see README, SonarQube section)."
            exit 0
          fi
          # The host arrives from a repository variable, a lower bar than the
          # secret it steers: anyone who can set variables could point
          # SONAR_TOKEN at a server of their choosing, and unlike editing this
          # file that change leaves no trace in the git history. Add a
          # self-hosted server here before pointing CI at it.
          case "$SONAR_HOST_URL" in
            https://sonarcloud.io) ;;
            *)
              echo "::error::Refusing to send SONAR_TOKEN to unapproved host $SONAR_HOST_URL."
              exit 1 ;;
          esac
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "host=$SONAR_HOST_URL" >> "$GITHUB_OUTPUT"

      - name: Download backend coverage
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-coverage
          path: rag-thesis-backend

      - name: Download frontend coverage
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-coverage
          path: rag-thesis-frontend/coverage

      - name: SonarQube scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # The allowlisted value the check step above resolved, never the raw
          # repository variable.
          SONAR_HOST_URL: ${{ steps.sonar.outputs.host }}
