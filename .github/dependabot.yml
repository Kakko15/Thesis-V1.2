version: 2
updates:
  - package-ecosystem: pip
    directory: /rag-thesis-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-production:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /rag-thesis-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-production:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ci-actions:
        patterns: ["*"]
