# Production stack for one VM (>= 4 GB RAM).
# Usage:  cp .env.production.example rag-thesis-backend/.env.production  (fill it in)
#         API_DOMAIN=api.yourdomain.com docker compose -f docker-compose.prod.yml up -d --build
services:
  api:
    build: ./rag-thesis-backend
    image: iskai-backend:latest
    env_file: ./rag-thesis-backend/.env.production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  worker:
    image: iskai-backend:latest
    env_file: ./rag-thesis-backend/.env.production
    command: ["python", "-m", "workers.ingestion_worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  redis:
    image: redis:8.6.4-alpine3.23
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: [clamav-db:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN, e.g. api.yourdomain.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]

volumes:
  redis-data:
  clamav-db:
  caddy-data:
  caddy-config:
